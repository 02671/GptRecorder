              public void UpdateArea(DrawingRectangle area)
              {
                  var sameSize = _area.Width == area.Width && _area.Height == area.Height;
                  _area = area;
                  if (!_ready) return;
                  if (sameSize)
                  {
                      Left = (_area.X - MarginPixels) / _scaleX;
                      Top = (_area.Y - MarginPixels) / _scaleY;
