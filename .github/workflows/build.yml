              private string ShortcutSettingsPath()
              {
                  return System.IO.Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "录屏", "hotkeys.ini");
              }

              private void LoadShortcutSettings()
              {
                  try
                  {
                      var path = ShortcutSettingsPath();
                      if (System.IO.File.Exists(path))
                      {
                          var lines = System.IO.File.ReadAllLines(path);
                          for (var i = 0; i < 4 && i < lines.Length; i++)
                          {
                              var parts = lines[i].Split(',');
                              if (parts.Length == 2 &&
                                  int.TryParse(parts[0], out var modifiers) &&
                                  int.TryParse(parts[1], out var virtualKey) &&
                                  modifiers >= 0 && modifiers <= 15 &&
                                  virtualKey > 0 && virtualKey <= 255)
                              {
                                  _shortcutModifiers[i] = modifiers;
                                  _shortcutKeys[i] = virtualKey;
                              }
                          }
                      }
                  }
                  catch { }
                  UpdateShortcutTextBoxes();
                  UpdateHotkeyHintText();
              }

              private void SaveShortcutSettings()
              {
                  try
                  {
                      var path = ShortcutSettingsPath();
                      System.IO.Directory.CreateDirectory(System.IO.Path.GetDirectoryName(path)!);
                      var lines = new string[4];
                      for (var i = 0; i < 4; i++)
                          lines[i] = _shortcutModifiers[i].ToString() + "," + _shortcutKeys[i].ToString();
                      System.IO.File.WriteAllLines(path, lines);
                  }
                  catch (Exception ex)
                  {
                      HotkeyHintText.Text = "无法保存快捷键设置：" + ex.Message;
                  }
              }

              private string FormatShortcut(int index)
              {
                  var parts = new System.Collections.Generic.List<string>();
                  var mods = _shortcutModifiers[index];
                  if ((mods & 2) != 0) parts.Add("Ctrl");
                  if ((mods & 1) != 0) parts.Add("Alt");
                  if ((mods & 4) != 0) parts.Add("Shift");
                  if ((mods & 8) != 0) parts.Add("Win");
                  var key = System.Windows.Input.KeyInterop.KeyFromVirtualKey(_shortcutKeys[index]);
                  parts.Add(key == System.Windows.Input.Key.None ? "VK" + _shortcutKeys[index].ToString() : key.ToString());
                  return string.Join("+", parts);
              }

              private void UpdateShortcutTextBoxes()
              {
                  RecordHotkeyBox.Text = FormatShortcut(0);
                  PauseHotkeyBox.Text = FormatShortcut(1);
                  StopHotkeyBox.Text = FormatShortcut(2);
                  CancelHotkeyBox.Text = FormatShortcut(3);
              }

              private void UpdateHotkeyHintText()
              {
                  HotkeyHintText.Text = "全局快捷键：录制 " + FormatShortcut(0) +
                      " · 暂停/继续 " + FormatShortcut(1) +
                      " · 结束并保存 " + FormatShortcut(2) +
                      " · 取消且不保存 " + FormatShortcut(3);
              }

              private void RegisterShortcutHotkeys()
              {
                  try
                  {
                      var handle = new System.Windows.Interop.WindowInteropHelper(this).Handle;
                      if (handle == System.IntPtr.Zero)
                          throw new InvalidOperationException("主窗口句柄尚未初始化。");
                      var currentSource = System.Windows.Interop.HwndSource.FromHwnd(handle);
                      if (currentSource == null)
                          throw new InvalidOperationException("无法获取主窗口消息源。");
                      if (!ReferenceEquals(_shortcutHwndSource, currentSource))
                      {
                          _shortcutHwndSource?.RemoveHook(ShortcutWindowProc);
                          _shortcutHwndSource = currentSource;
                          _shortcutHwndSource.AddHook(ShortcutWindowProc);
                      }

                      for (var i = 1; i <= 4; i++) AppUnregisterHotKey(handle, i);
                      var failed = new System.Collections.Generic.List<string>();
                      for (var i = 0; i < 4; i++)
                      {
                          var ok = AppRegisterHotKey(handle, i + 1, (uint)(_shortcutModifiers[i] | 0x4000), (uint)_shortcutKeys[i]);
                          if (!ok)
                          {
                              var winError = System.Runtime.InteropServices.Marshal.GetLastWin32Error();
                              failed.Add(new string[] { "录制", "暂停", "结束", "取消" }[i] + " " + FormatShortcut(i) + "（Windows 错误 " + winError + "）");
                          }
                      }

                      UpdateHotkeyHintText();
                      if (failed.Count > 0)
                          HotkeyHintText.Text += "；注册失败（可能被系统或其他程序占用）：" + string.Join("、", failed);
                  }
                  catch (Exception ex)
                  {
                      HotkeyHintText.Text = "快捷键初始化失败（" + ex.GetType().Name + "）：" + ex.Message;
                  }
              }

              private void UnregisterShortcutHotkeys()
              {
                  try
                  {
                      var handle = new System.Windows.Interop.WindowInteropHelper(this).Handle;
                      if (handle != System.IntPtr.Zero)
                          for (var i = 1; i <= 4; i++) AppUnregisterHotKey(handle, i);
                  }
                  catch { }
                  _shortcutHwndSource?.RemoveHook(ShortcutWindowProc);
                  _shortcutHwndSource = null;
              }

              private System.IntPtr ShortcutWindowProc(System.IntPtr hwnd, int msg, System.IntPtr wParam, System.IntPtr lParam, ref bool handled)
              {
                  if (msg != ShortcutMessageId) return System.IntPtr.Zero;
                  HandleGlobalShortcut(wParam.ToInt32());
                  handled = true;
                  return System.IntPtr.Zero;
              }

              private void HandleGlobalShortcut(int id)
              {
                  switch (id)
                  {
                      case 1:
                          if (!_isRecording && !_isStarting && !_isStopping)
                              RecordButton_Click(this, new RoutedEventArgs());
                          break;
                      case 2:
                          PauseButton_Click(this, new RoutedEventArgs());
                          break;
                      case 3:
                          if (_isRecording && !_isStarting && !_isStopping)
                              RecordButton_Click(this, new RoutedEventArgs());
                          break;
                      case 4:
                          CancelRegionRecordingWithoutSaving();
                          break;
                  }
              }

              private void HotkeyTextBox_GotKeyboardFocus(object sender, KeyboardFocusChangedEventArgs e)
              {
                  UnregisterShortcutHotkeys();
                  HotkeyHintText.Text = "正在设置快捷键：按下组合键；按 Esc 放弃本次修改。";
              }

              private void HotkeyTextBox_LostKeyboardFocus(object sender, KeyboardFocusChangedEventArgs e)
              {
                  RegisterShortcutHotkeys();
                  UpdateHotkeyHintText();
              }

              private void HotkeyTextBox_PreviewKeyDown(object sender, KeyEventArgs e)
              {
                  if (!(sender is TextBox box)) return;
                  var key = e.Key == System.Windows.Input.Key.System ? e.SystemKey : e.Key;
                  if (key == System.Windows.Input.Key.Escape)
                  {
                      Keyboard.ClearFocus();
                      e.Handled = true;
                      UpdateShortcutTextBoxes();
                      return;
                  }
                  if (key == System.Windows.Input.Key.LeftCtrl || key == System.Windows.Input.Key.RightCtrl ||
                      key == System.Windows.Input.Key.LeftAlt || key == System.Windows.Input.Key.RightAlt ||
                      key == System.Windows.Input.Key.LeftShift || key == System.Windows.Input.Key.RightShift ||
                      key == System.Windows.Input.Key.LWin || key == System.Windows.Input.Key.RWin)
                  {
                      e.Handled = true;
                      return;
                  }

                  var modifiers = 0;
                  var keyboardModifiers = System.Windows.Input.Keyboard.Modifiers;
                  if ((keyboardModifiers & System.Windows.Input.ModifierKeys.Control) != 0) modifiers |= 2;
                  if ((keyboardModifiers & System.Windows.Input.ModifierKeys.Alt) != 0) modifiers |= 1;
                  if ((keyboardModifiers & System.Windows.Input.ModifierKeys.Shift) != 0) modifiers |= 4;
                  if ((keyboardModifiers & System.Windows.Input.ModifierKeys.Windows) != 0) modifiers |= 8;
                  var virtualKey = System.Windows.Input.KeyInterop.VirtualKeyFromKey(key);
                  var index = box.Name == "RecordHotkeyBox" ? 0 :
                              box.Name == "PauseHotkeyBox" ? 1 :
                              box.Name == "StopHotkeyBox" ? 2 : 3;

                  if (modifiers == 0 || virtualKey <= 0)
                  {
                      HotkeyHintText.Text = "请按组合键设置快捷键，至少包含 Ctrl、Alt、Shift 或 Win 中的一个修饰键。";
                      e.Handled = true;
                      return;
                  }
                  for (var i = 0; i < 4; i++)
                  {
                      if (i != index && _shortcutModifiers[i] == modifiers && _shortcutKeys[i] == virtualKey)
                      {
                          HotkeyHintText.Text = "快捷键重复，请为每个操作设置不同的组合键。";
                          e.Handled = true;
                          return;
                      }
                  }

                  _shortcutModifiers[index] = modifiers;
                  _shortcutKeys[index] = virtualKey;
                  UpdateShortcutTextBoxes();
                  SaveShortcutSettings();
                  SetStatus("快捷键已更新", StatusTone.Ready);
                  e.Handled = true;
                  Keyboard.ClearFocus();
              }


