name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reassemble project archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path . -Filter 'project-archive.part*.txt' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'Project archive parts are missing.' }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes("$PWD\project.zip", [Convert]::FromBase64String($encoded))
          Expand-Archive -Path .\project.zip -DestinationPath .\_src -Force
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish .\_src\GptRecorder\QingRecorder\QingRecorder.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:PublishTrimmed=false --output .\artifacts\publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          Compress-Archive -Path '.\artifacts\publish\*' -DestinationPath '.\artifacts\轻录屏-Windows-x64.zip' -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingRecorder-Windows-x64
          path: artifacts/轻录屏-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 轻录屏 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/轻录屏-Windows-x64.zip
