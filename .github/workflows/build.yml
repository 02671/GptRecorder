name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify and extract project archive
        shell: pwsh
        run: |
          if (!(Test-Path .\project.zip)) { throw 'Please upload the provided project ZIP to the repository root as project.zip.' }
          Expand-Archive -Path .\project.zip -DestinationPath .\_src -Force
          $project = Get-ChildItem -Path .\_src -Filter QingRecorder.csproj -Recurse | Select-Object -First 1
          if (!$project) { throw 'QingRecorder.csproj was not found inside project.zip.' }
          "PROJECT_FILE=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Enable Windows 10 1607 capture and compact the UI
        shell: pwsh
        run: |
          $root = Split-Path $env:PROJECT_FILE
          $xamlPath = Join-Path $root 'MainWindow.xaml'
          $xaml = Get-Content -LiteralPath $xamlPath -Raw
          $oldWindowSize = 'Height="790" Width="720" MinHeight="790" MinWidth="720"'
          if (!$xaml.Contains($oldWindowSize)) { throw 'Could not find the original main-window dimensions.' }
          $xaml = $xaml.Replace($oldWindowSize, 'Height="650" Width="640" MinHeight="650" MinWidth="640"')
          $rowToken = '<Grid.RowDefinitions>'
          $rowIndex = $xaml.IndexOf($rowToken, [StringComparison]::Ordinal)
          if ($rowIndex -lt 0) { throw 'Could not find the main layout grid.' }
          if (!$xaml.Contains('<Grid.LayoutTransform>')) {
            $transform = '<Grid.LayoutTransform><ScaleTransform ScaleX="0.75" ScaleY="0.75" /></Grid.LayoutTransform>' + [Environment]::NewLine + '    '
            $xaml = $xaml.Insert($rowIndex, $transform)
          }
          $regionRadioToken = '<RadioButton x:Name="RegionRadio" GroupName="CaptureMode"'
          if ($xaml.Contains($regionRadioToken)) {
            $xaml = $xaml.Replace($regionRadioToken, '<RadioButton x:Name="RegionRadio" Click="RegionRadio_Click" GroupName="CaptureMode"')
          } elseif (!$xaml.Contains('Click="RegionRadio_Click"')) {
            throw 'Could not find RegionRadio in MainWindow.xaml.'
          }
          $xaml = @'
          <Window x:Class="QingRecorder.MainWindow"
                  xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                  xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
                  Title="录屏" Height="52" MinHeight="52" MinWidth="0" SizeToContent="Width"
                  WindowStartupLocation="Manual" ResizeMode="NoResize" WindowStyle="None"
                  AllowsTransparency="True" Background="Transparent" Topmost="True" ShowInTaskbar="True" PreviewKeyDown="MainWindow_PreviewKeyDown"
                  Loaded="MainWindow_Loaded" SourceInitialized="MainWindow_SourceInitialized" Closing="MainWindow_Closing">
              <Window.Resources>
                  <Style x:Key="ActionButton" TargetType="{x:Type Button}">
                      <Setter Property="Height" Value="34"/>
                      <Setter Property="MinWidth" Value="62"/>
                      <Setter Property="Margin" Value="0,0,6,0"/>
                      <Setter Property="Padding" Value="11,4"/>
                      <Setter Property="FontSize" Value="12"/>
                      <Setter Property="FontWeight" Value="SemiBold"/>
                      <Setter Property="Foreground" Value="#334155"/>
                      <Setter Property="Background" Value="#F7F9FC"/>
                      <Setter Property="BorderBrush" Value="#D8E1ED"/>
                      <Setter Property="BorderThickness" Value="1"/>
                      <Setter Property="Cursor" Value="Hand"/>
                      <Setter Property="Template">
                          <Setter.Value>
                              <ControlTemplate TargetType="{x:Type Button}">
                                  <Border x:Name="ButtonShell" Background="{TemplateBinding Background}" BorderBrush="{TemplateBinding BorderBrush}" BorderThickness="{TemplateBinding BorderThickness}" CornerRadius="6" Padding="{TemplateBinding Padding}">
                                      <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center" RecognizesAccessKey="True"/>
                                  </Border>
                                  <ControlTemplate.Triggers>
                                      <Trigger Property="IsMouseOver" Value="True">
                                          <Setter TargetName="ButtonShell" Property="Background" Value="#EAF0FA"/>
                                          <Setter TargetName="ButtonShell" Property="BorderBrush" Value="#BFCDE0"/>
                                      </Trigger>
                                      <Trigger Property="IsPressed" Value="True">
                                          <Setter TargetName="ButtonShell" Property="Background" Value="#DFE8F7"/>
                                      </Trigger>
                                      <Trigger Property="IsEnabled" Value="False">
                                          <Setter TargetName="ButtonShell" Property="Opacity" Value="0.55"/>
                                      </Trigger>
                                  </ControlTemplate.Triggers>
                              </ControlTemplate>
                          </Setter.Value>
                      </Setter>
                  </Style>
                  <Style x:Key="ModeRadio" TargetType="{x:Type RadioButton}">
                      <Setter Property="Width" Value="64"/>
                      <Setter Property="Height" Value="34"/>
                      <Setter Property="Margin" Value="0,0,6,0"/>
                      <Setter Property="Padding" Value="8,4"/>
                      <Setter Property="FontSize" Value="12"/>
                      <Setter Property="FontWeight" Value="SemiBold"/>
                      <Setter Property="Foreground" Value="#334155"/>
                      <Setter Property="Background" Value="#F7F9FC"/>
                      <Setter Property="BorderBrush" Value="#D8E1ED"/>
                      <Setter Property="BorderThickness" Value="1"/>
                      <Setter Property="Cursor" Value="Hand"/>
                      <Setter Property="Template">
                          <Setter.Value>
                              <ControlTemplate TargetType="{x:Type RadioButton}">
                                  <Border x:Name="RadioShell" Background="{TemplateBinding Background}" BorderBrush="{TemplateBinding BorderBrush}" BorderThickness="{TemplateBinding BorderThickness}" CornerRadius="6" Padding="{TemplateBinding Padding}">
                                      <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center" RecognizesAccessKey="True"/>
                                  </Border>
                                  <ControlTemplate.Triggers>
                                      <Trigger Property="IsChecked" Value="True">
                                          <Setter TargetName="RadioShell" Property="Background" Value="#E8F0FF"/>
                                          <Setter TargetName="RadioShell" Property="BorderBrush" Value="#7EA2F6"/>
                                          <Setter Property="Foreground" Value="#2455C8"/>
                                      </Trigger>
                                      <Trigger Property="IsMouseOver" Value="True">
                                          <Setter TargetName="RadioShell" Property="BorderBrush" Value="#9CB4D8"/>
                                      </Trigger>
                                      <Trigger Property="IsEnabled" Value="False">
                                          <Setter TargetName="RadioShell" Property="Opacity" Value="0.55"/>
                                      </Trigger>
                                  </ControlTemplate.Triggers>
                              </ControlTemplate>
                          </Setter.Value>
                      </Setter>
                  </Style>
              </Window.Resources>
              <Grid Margin="0">
                  <Grid.RowDefinitions>
                      <RowDefinition Height="Auto"/>
                      <RowDefinition Height="Auto"/>
                  </Grid.RowDefinitions>
                  <Border Grid.Row="0" Background="#FFFFFF" BorderBrush="#DCE4EF" BorderThickness="1" CornerRadius="8" Padding="6,5" MouseLeftButtonDown="ToolbarSurface_MouseLeftButtonDown">
                      <StackPanel Orientation="Horizontal" VerticalAlignment="Center">
                          <RadioButton x:Name="FullScreenRadio" Style="{StaticResource ModeRadio}" Click="FullScreenRadio_Click" GroupName="CaptureMode" IsChecked="True" Content="全屏"/>
                          <RadioButton x:Name="RegionRadio" Style="{StaticResource ModeRadio}" Click="RegionRadio_Click" GroupName="CaptureMode" Content="区域"/>
                          <Border Width="1" Height="28" Background="#E1E7F0" Margin="2,0,8,0"/>
                          <Button x:Name="RecordButton" Style="{StaticResource ActionButton}" MinWidth="62" Margin="0,0,6,0" Content="录制" Click="RecordButton_Click"/>
                          <Button x:Name="PauseButton" Style="{StaticResource ActionButton}" MinWidth="62" Margin="0,0,6,0" Content="暂停" Click="PauseButton_Click" IsEnabled="False"/>
                          <Button Style="{StaticResource ActionButton}" Content="打开目录" Click="OpenFolder_Click"/>
                          <Button x:Name="OptionsButton" Style="{StaticResource ActionButton}" Content="选项" Click="OptionsButton_Click"/>
                          <Border Background="#F0FDF4" BorderBrush="#D4F4DF" BorderThickness="1" CornerRadius="6" Padding="8,6" Margin="0,0,10,0" VerticalAlignment="Center">
                              <StackPanel Orientation="Horizontal" VerticalAlignment="Center">
                                  <Ellipse x:Name="StatusDot" Width="7" Height="7" Fill="#22A568" Margin="0,0,7,0"/>
                                  <TextBlock x:Name="StatusText" Text="准备就绪" FontSize="12" Foreground="#16814D" VerticalAlignment="Center" MaxWidth="145" TextTrimming="CharacterEllipsis"/>
                              </StackPanel>
                          </Border>
                          <TextBlock x:Name="TimerText" Text="00:00:00" Visibility="Collapsed" FontSize="14" FontFamily="Consolas" Foreground="#27364B" VerticalAlignment="Center" MinWidth="76" Margin="0,0,10,0"/>
                          <Button x:Name="CloseButton" Style="{StaticResource ActionButton}" Content="关闭" MinWidth="54" Margin="0" Click="CloseButton_Click"/>
                      </StackPanel>
                  </Border>
                  <Grid x:Name="OptionsPanel" Grid.Row="1" Visibility="Collapsed" Margin="0,8,0,0">
                      <Border Background="#FFFFFF" BorderBrush="#DCE4EF" BorderThickness="1" CornerRadius="9" Padding="13,11">
                          <StackPanel>
                              <StackPanel Orientation="Horizontal" VerticalAlignment="Center">
                                  <TextBlock Text="录制声音" FontSize="12" Foreground="#64748B" VerticalAlignment="Center" Margin="0,0,12,0"/>
                                  <CheckBox x:Name="SystemAudioCheck" Content="系统声音" IsChecked="True" FontSize="12" Foreground="#334155" VerticalAlignment="Center" Margin="0,0,16,0"/>
                                  <CheckBox x:Name="MicrophoneCheck" Content="麦克风" IsChecked="True" FontSize="12" Foreground="#334155" VerticalAlignment="Center" Margin="0,0,18,0"/>
                                  <Border Width="1" Height="22" Background="#E1E7F0" Margin="0,0,15,0"/>
                                  <TextBlock Text="帧率" FontSize="12" Foreground="#64748B" VerticalAlignment="Center" Margin="0,0,8,0"/>
                                  <ComboBox x:Name="FpsCombo" Width="96" Height="29" VerticalContentAlignment="Center" SelectedIndex="1" FontSize="12" Padding="6,2">
                                      <ComboBoxItem Content="15 FPS"/>
                                      <ComboBoxItem Content="30 FPS"/>
                                      <ComboBoxItem Content="60 FPS"/>
                                  </ComboBox>
                                  <CheckBox x:Name="TopmostCheck" Content="窗口置顶" IsChecked="True" Checked="TopmostCheck_Changed" Unchecked="TopmostCheck_Changed" FontSize="12" Foreground="#334155" VerticalAlignment="Center" Margin="14,0,0,0"/>
                              </StackPanel>
                              <Grid Margin="0,10,0,0">
                                  <Grid.ColumnDefinitions>
                                      <ColumnDefinition Width="72"/>
                                      <ColumnDefinition Width="*"/>
                                      <ColumnDefinition Width="Auto"/>
                                  </Grid.ColumnDefinitions>
                                  <TextBlock Grid.Column="0" Text="保存位置" FontSize="12" Foreground="#64748B" VerticalAlignment="Center"/>
                                  <TextBox x:Name="OutputPathText" Grid.Column="1" Height="30" VerticalContentAlignment="Center" Padding="8,3" BorderBrush="#D8E1ED" Background="#FBFCFE" FontSize="12" Margin="0,0,8,0"/>
                                  <Button Grid.Column="2" Style="{StaticResource ActionButton}" Content="选择文件夹" Click="BrowseFolder_Click" Margin="0" Height="30" VerticalAlignment="Center"/>
                              </Grid>
                              <TextBlock Text="全局快捷键" FontSize="12" FontWeight="SemiBold" Foreground="#334155" Margin="0,12,0,6"/>
                              <StackPanel Orientation="Vertical">
                                  <StackPanel Orientation="Horizontal" VerticalAlignment="Center" Margin="0,0,0,5">
                                      <TextBlock Text="录制" Width="42" FontSize="12" Foreground="#64748B" VerticalAlignment="Center"/>
                                      <TextBox x:Name="RecordHotkeyBox" Width="104" Height="27" Margin="0,0,14,0" IsReadOnly="True" Text="Ctrl+Alt+R" ToolTip="点击此处，然后按下要设置的组合键" PreviewKeyDown="HotkeyTextBox_PreviewKeyDown" GotKeyboardFocus="HotkeyTextBox_GotKeyboardFocus" LostKeyboardFocus="HotkeyTextBox_LostKeyboardFocus" Focusable="True" FontSize="12" Padding="6,3"/>
                                      <TextBlock Text="暂停/继续" Width="62" FontSize="12" Foreground="#64748B" VerticalAlignment="Center"/>
                                      <TextBox x:Name="PauseHotkeyBox" Width="104" Height="27" IsReadOnly="True" Text="Ctrl+Alt+P" ToolTip="点击此处，然后按下要设置的组合键" PreviewKeyDown="HotkeyTextBox_PreviewKeyDown" GotKeyboardFocus="HotkeyTextBox_GotKeyboardFocus" LostKeyboardFocus="HotkeyTextBox_LostKeyboardFocus" Focusable="True" FontSize="12" Padding="6,3"/>
                                  </StackPanel>
                                  <StackPanel Orientation="Horizontal" VerticalAlignment="Center" Margin="0,0,0,5">
                                      <TextBlock Text="结束" Width="42" FontSize="12" Foreground="#64748B" VerticalAlignment="Center"/>
                                      <TextBox x:Name="StopHotkeyBox" Width="104" Height="27" Margin="0,0,14,0" IsReadOnly="True" Text="Ctrl+Alt+S" ToolTip="点击此处，然后按下要设置的组合键" PreviewKeyDown="HotkeyTextBox_PreviewKeyDown" GotKeyboardFocus="HotkeyTextBox_GotKeyboardFocus" LostKeyboardFocus="HotkeyTextBox_LostKeyboardFocus" Focusable="True" FontSize="12" Padding="6,3"/>
                                      <TextBlock Text="取消" Width="62" FontSize="12" Foreground="#64748B" VerticalAlignment="Center"/>
                                      <TextBox x:Name="CancelHotkeyBox" Width="104" Height="27" IsReadOnly="True" Text="Ctrl+Alt+X" ToolTip="点击此处，然后按下要设置的组合键" PreviewKeyDown="HotkeyTextBox_PreviewKeyDown" GotKeyboardFocus="HotkeyTextBox_GotKeyboardFocus" LostKeyboardFocus="HotkeyTextBox_LostKeyboardFocus" Focusable="True" FontSize="12" Padding="6,3"/>
                                  </StackPanel>
                                  <TextBlock x:Name="HotkeyHintText" Text="点击快捷键输入框后按组合键；快捷键在全局生效。" FontSize="11" Foreground="#718096" TextWrapping="Wrap" MaxWidth="560" Margin="0,2,0,0"/>
                              </StackPanel>
                              <TextBlock x:Name="LatestFileText" Text="" Visibility="Collapsed" Width="0" Height="0"/>
                          </StackPanel>
                      </Border>
                  </Grid>
              </Grid>
          </Window>
          '@
          $xaml = [regex]::Replace($xaml, '(?s)\s*<TextBlock Text="全局快捷键".*?<TextBlock x:Name="HotkeyHintText".*?</StackPanel>', '')
          Set-Content -LiteralPath $xamlPath -Value $xaml -Encoding utf8
          $mainPath = Join-Path $root 'MainWindow.xaml.cs'
          $main = Get-Content -LiteralPath $mainPath -Raw
          if (!$main.Contains('Left = (SystemParameters.PrimaryScreenWidth - ActualWidth) / 2; Top = 0;')) {
            if (!$main.Contains('InitializeComponent();')) { throw 'Could not find MainWindow InitializeComponent for startup placement.' }
            $main = $main.Replace('InitializeComponent();', 'InitializeComponent();' + [Environment]::NewLine + '        WindowStartupLocation = WindowStartupLocation.Manual;' + [Environment]::NewLine + '        Loaded += (_, _) => { Left = (SystemParameters.PrimaryScreenWidth - ActualWidth) / 2; Top = 0; };')
          }
          $main = $main.Replace('FpsCombo.SelectedIndex = _settings.FrameRate == 60 ? 1 : 0;', 'FpsCombo.SelectedIndex = _settings.FrameRate == 15 ? 0 : _settings.FrameRate == 60 ? 2 : 1;')
          $main = $main.Replace('Framerate = FpsCombo.SelectedIndex == 1 ? 60 : 30,', 'Framerate = FpsCombo.SelectedIndex == 0 ? 15 : FpsCombo.SelectedIndex == 2 ? 60 : 30,')
          $main = $main.Replace('_settings.FrameRate = FpsCombo.SelectedIndex == 1 ? 60 : 30;', '_settings.FrameRate = FpsCombo.SelectedIndex == 0 ? 15 : FpsCombo.SelectedIndex == 2 ? 60 : 30;')
          if (!$main.Contains('private DrawingRectangle? _selectedRegionForRecording;')) {
            $classForState = [regex]::Match($main, '(?s)\bclass\s+MainWindow\b[^\{]*\{')
            if (!$classForState.Success) { throw 'Could not find MainWindow class for region state.' }
            $stateFields = "`r`n    private DrawingRectangle? _selectedRegionForRecording;`r`n    private bool _isOpeningRegionSelector;`r`n    private RegionOutlineWindow? _regionOutlineWindow;`r`n    private RegionMoveHandleWindow? _regionMoveHandleWindow;`r`n    private RegionResizeHandlesController? _regionResizeHandles;`r`n    private DisplayRecordingSource? _activeDisplaySource;`r`n    private bool _discardRecordingOnComplete;`r`n    private bool _isPaused;`r`n    private readonly System.Diagnostics.Stopwatch _activeRecordingClock = new System.Diagnostics.Stopwatch();`r`n    private System.Windows.Interop.HwndSource? _shortcutHwndSource;`r`n    private int[] _shortcutModifiers = new int[] { 3, 3, 3, 3 };`r`n    private int[] _shortcutKeys = new int[] { 0x52, 0x50, 0x53, 0x58 };`r`n    private const int ShortcutMessageId = 0x0312;`r`n    [System.Runtime.InteropServices.DllImport(`"user32.dll`", EntryPoint = `"RegisterHotKey`", SetLastError = true)] private static extern bool AppRegisterHotKey(System.IntPtr hWnd, int id, uint modifiers, uint virtualKey);`r`n    [System.Runtime.InteropServices.DllImport(`"user32.dll`", EntryPoint = `"UnregisterHotKey`", SetLastError = true)] private static extern bool AppUnregisterHotKey(System.IntPtr hWnd, int id);"
            $main = $main.Insert($classForState.Index + $classForState.Length, $stateFields)
          }
          $oldRegionFlow = '(?s)DrawingRectangle\? selectedRegion = null;\s*if \(RegionRadio\.IsChecked == true\)\s*\{\s*ShowInTaskbar = true;.*?selectedRegion = selector\.SelectedArea;\s*\}'
          $newRegionFlow = @'
          DrawingRectangle? selectedRegion = null;
          if (RegionRadio.IsChecked == true)
          {
              selectedRegion = _selectedRegionForRecording;
              if (selectedRegion is null)
              {
                  SetStatus("请先点击“区域录制”并完成区域框选", StatusTone.Ready);
                  return;
              }
          }
          else
          {
              _selectedRegionForRecording = null;
          }
          '@
          $patchedRegionFlow = [regex]::Replace($main, $oldRegionFlow, $newRegionFlow, [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($patchedRegionFlow -eq $main -and !$main.Contains('selectedRegion = _selectedRegionForRecording;')) {
            throw 'Could not replace the original region-selection block in StartRecordingAsync.'
          }
          $main = $patchedRegionFlow
          if (!$main.Contains('private void RegionRadio_Click(object sender, RoutedEventArgs e)')) {
            $regionHandler = @'
              private void RegionRadio_Click(object sender, RoutedEventArgs e)
              {
                  if (!IsLoaded || _isStarting || _isRecording || _isStopping || _isOpeningRegionSelector) return;
                  _isOpeningRegionSelector = true;
                  try
                  {
                      CloseRegionOutline();
                      ShowInTaskbar = true;
                      WindowState = WindowState.Normal;
                      Activate();
                      var selector = new RegionSelectionWindow { Owner = this };
                      var accepted = selector.ShowDialog();
                      if (accepted != true || selector.SelectedArea is null)
                      {
                          _selectedRegionForRecording = null;
                          SetStatus("已取消区域选择，请重新点击“区域录制”框选", StatusTone.Ready);
                          return;
                      }
                      _selectedRegionForRecording = selector.SelectedArea;
                      try
                      {
                          ShowRegionOutline(selector.SelectedArea.Value);
                      }
                      catch (Exception ex)
                      {
                          _selectedRegionForRecording = null;
                          CloseRegionOutline();
                          FullScreenRadio.IsChecked = true;
                          SetStatus("区域工具加载失败", StatusTone.Error);
                          MessageBox.Show(this, $"区域工具加载失败：{ex.Message}", "录屏", MessageBoxButton.OK, MessageBoxImage.Error);
                          return;
                      }
                      Activate();
                      System.Windows.Input.Keyboard.Focus(RegionRadio);
                      SetStatus("已选择区域，可拖动右上角圆点调整位置，Esc 取消区域", StatusTone.Ready);
                  }
                  finally
                  {
                      _isOpeningRegionSelector = false;
                  }
              }

          '@
            $startMethod = [regex]::Match($main, '(?m)^\s*private async Task StartRecordingAsync\s*\(')
            if (!$startMethod.Success) { throw 'Could not find StartRecordingAsync to insert the region-click handler.' }
            $main = $main.Insert($startMethod.Index, $regionHandler)
          }
          if (!$main.Contains('private void OptionsButton_Click(object sender, RoutedEventArgs e)'))
          {
            $toolbarHandlers = @'
              private void OptionsButton_Click(object sender, RoutedEventArgs e)
              {
                  var expanded = OptionsPanel.Visibility != Visibility.Visible;
                  OptionsPanel.Visibility = expanded ? Visibility.Visible : Visibility.Collapsed;
                  Height = expanded ? 310 : 52;
                  OptionsButton.Content = expanded ? "收起" : "选项";
              }

              private void CloseButton_Click(object sender, RoutedEventArgs e)
              {
                  Close();
              }

              private void ToolbarSurface_MouseLeftButtonDown(object sender, MouseButtonEventArgs e)
              {
                  if (e.LeftButton == MouseButtonState.Pressed) DragMove();
              }

          '@
            $recordMethod = [regex]::Match($main, '(?m)^\s*private async Task StartRecordingAsync\s*\(')
            if (!$recordMethod.Success) { throw 'Could not find StartRecordingAsync to add toolbar handlers.' }
            $main = $main.Insert($recordMethod.Index, $toolbarHandlers)
          }
          $oldClockLine = 'StatusText.Text = $"录制中 · {elapsed:hh\\:mm\\:ss}";'
          if ($main.Contains($oldClockLine)) {
            $main = $main.Replace($oldClockLine, 'elapsed = _activeRecordingClock.Elapsed;' + [Environment]::NewLine + '        StatusText.Text = "录制中 · 暂停 " + FormatShortcut(1);' + [Environment]::NewLine + '        TimerText.Text = $"{elapsed:hh\\:mm\\:ss}";' + [Environment]::NewLine + '        _regionMoveHandleWindow?.SetRecordingTime(TimerText.Text);')
          } elseif (!$main.Contains('TimerText.Text = $"{elapsed:hh\\:mm\\:ss}";')) {
            throw 'Could not locate UpdateRecordingClock text to separate the timer display.'
          }
          $oldRecordingStatus = 'SetStatus("录制中 · 00:00:00", StatusTone.Recording);'
          if ($main.Contains($oldRecordingStatus)) {
            $main = $main.Replace($oldRecordingStatus, 'SetStatus("录制中 · 暂停 " + FormatShortcut(1), StatusTone.Recording);' + [Environment]::NewLine + '            _isPaused = false;' + [Environment]::NewLine + '            _activeRecordingClock.Restart();' + [Environment]::NewLine + '            PauseButton.Content = "暂停";' + [Environment]::NewLine + '            PauseButton.IsEnabled = true;' + [Environment]::NewLine + '            TimerText.Text = "00:00:00";' + [Environment]::NewLine + '            _regionMoveHandleWindow?.SetRecordingTime(TimerText.Text);' + [Environment]::NewLine + '            _regionMoveHandleWindow?.RefreshActionState();')
          } elseif (!$main.Contains('TimerText.Text = "00:00:00";')) {
            throw 'Could not locate the start-recording status to initialize the timer.'
          }
          $audioMarker = 'var audioSources = new List<AudioSourceBase>();'
          if ($main.Contains($audioMarker) -and !$main.Contains('_activeDisplaySource = displaySource;')) {
            $main = $main.Replace($audioMarker, '_activeDisplaySource = displaySource;' + [Environment]::NewLine + '            ' + $audioMarker)
          }
          $oldApi = 'displaySource.RecorderApi = RecorderApi.WindowsGraphicsCapture;'
          if ($main.Contains($oldApi)) {
            $main = $main.Replace($oldApi, 'displaySource.RecorderApi = RecorderApi.DesktopDuplication;')
          } elseif (!$main.Contains('displaySource.RecorderApi = RecorderApi.DesktopDuplication;')) {
            throw 'Could not locate the display capture API assignment.'
          }
          $cropPattern = 'outputOptions\.SourceRect\s*=\s*new ScreenRect\(rect\.X,\s*rect\.Y,\s*rect\.Width,\s*rect\.Height\);'
          $fixedMain = [regex]::Replace($main, $cropPattern, 'displaySource.SourceRect = new ScreenRect(rect.X, rect.Y, rect.Width, rect.Height);', [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if ($fixedMain -eq $main -and !$main.Contains('displaySource.SourceRect = new ScreenRect(rect.X, rect.Y, rect.Width, rect.Height);')) {
            throw 'Could not find the region crop assignment to fix.'
          }
          $main = $fixedMain
          $classMatch = [regex]::Match($main, '(?s)\bclass\s+MainWindow\b[^\{]*\{')
          if (!$classMatch.Success) { throw 'Could not find MainWindow class to add the region outline.' }
          if (!$main.Contains('private RegionOutlineWindow? _regionOutlineWindow;')) {
            $main = $main.Insert($classMatch.Index + $classMatch.Length, "`r`n    private RegionOutlineWindow? _regionOutlineWindow;")
          }
          $helperMethods = @'
              private void TopmostCheck_Changed(object sender, RoutedEventArgs e)
              {
                  Topmost = TopmostCheck.IsChecked == true;
              }

              private void MainWindow_PreviewKeyDown(object sender, KeyEventArgs e)
              {
                  if (Keyboard.FocusedElement is TextBox hotkeyBox && (hotkeyBox.Name == "RecordHotkeyBox" || hotkeyBox.Name == "PauseHotkeyBox" || hotkeyBox.Name == "StopHotkeyBox" || hotkeyBox.Name == "CancelHotkeyBox")) return;
                  if (e.Key != System.Windows.Input.Key.Escape) return;
                  CancelSelectedRegion();
                  e.Handled = true;
              }

              private void CancelSelectedRegion()
              {
                  if (!_selectedRegionForRecording.HasValue ||
                      _isRecording || _isStarting || _isStopping)
                      return;

                  _selectedRegionForRecording = null;
                  CloseRegionOutline();
                  FullScreenRadio.IsChecked = true;
                  SetStatus("已取消区域选择", StatusTone.Ready);
              }

              private void StartRegionRecordingFromOverlay()
              {
                  if (!_selectedRegionForRecording.HasValue || _isStarting || _isRecording || _isStopping) return;
                  RecordButton_Click(this, new RoutedEventArgs());
              }

              private void StopRegionRecordingFromOverlay()
              {
                  if (!_selectedRegionForRecording.HasValue || !_isRecording || _isStarting || _isStopping) return;
                  RecordButton_Click(this, new RoutedEventArgs());
              }

              private void PauseRecordingFromOverlay()
              {
                  if (!_selectedRegionForRecording.HasValue || !_isRecording || _isStarting || _isStopping) return;
                  PauseButton_Click(this, new RoutedEventArgs());
              }

              private void CancelRegionRecordingWithoutSaving()
              {
                  if (!_isRecording || _isStarting || _isStopping) return;
                  _discardRecordingOnComplete = true;
                  RecordButton_Click(this, new RoutedEventArgs());
              }

              private void PauseButton_Click(object sender, RoutedEventArgs e)
              {
                  if (!_isRecording || _isStarting || _isStopping || _recorder == null) return;
                  try
                  {
                      if (_isPaused)
                      {
                          _recorder.Resume();
                          _isPaused = false;
                          _activeRecordingClock.Start();
                          _clock.Start();
                          PauseButton.Content = "暂停";
                          SetStatus("录制中 · 暂停 " + FormatShortcut(1), StatusTone.Recording);
                      }
                      else
                      {
                          _recorder.Pause();
                          _isPaused = true;
                          _activeRecordingClock.Stop();
                          _clock.Stop();
                          PauseButton.Content = "继续";
                          SetStatus("录制已暂停 · 继续 " + FormatShortcut(1), StatusTone.Busy);
                      }
                      _regionMoveHandleWindow?.RefreshActionState();
                  }
                  catch (Exception ex)
                  {
                      SetStatus("暂停操作失败", StatusTone.Error);
                      MessageBox.Show(this, "暂停或继续录制失败：" + ex.Message, "录屏", MessageBoxButton.OK, MessageBoxImage.Error);
                  }
              }

              private void ResetRecordingClock()
              {
                  _clock.Stop();
                  _activeRecordingClock.Reset();
                  _isPaused = false;
                  PauseButton.Content = "暂停";
                  PauseButton.IsEnabled = false;
                  TimerText.Text = "00:00:00";
                  _regionMoveHandleWindow?.SetRecordingTime(TimerText.Text);
                  _regionMoveHandleWindow?.RefreshActionState();
                  _regionResizeHandles?.SetVisible(_selectedRegionForRecording.HasValue);
              }

              private void FullScreenRadio_Click(object sender, RoutedEventArgs e)
              {
                  if (!IsLoaded || _isStarting || _isRecording || _isStopping) return;
                  _selectedRegionForRecording = null;
                  _activeDisplaySource = null;
                  CloseRegionOutline();
                  SetStatus("全屏录制模式", StatusTone.Ready);
              }

              private void ShowRegionOutline(DrawingRectangle area)
              {
                  if (_regionOutlineWindow == null || !_regionOutlineWindow.IsVisible)
                  {
                      _regionOutlineWindow?.Close();
                      _regionOutlineWindow = new RegionOutlineWindow(area);
                      _regionOutlineWindow.Show();
                  }
                  else
                  {
                      _regionOutlineWindow.UpdateArea(area);
                  }

                  if (_regionMoveHandleWindow == null || !_regionMoveHandleWindow.IsVisible)
                  {
                      _regionMoveHandleWindow?.Close();
                      _regionMoveHandleWindow = new RegionMoveHandleWindow(area, UpdateSelectedRegion, StartRegionRecordingFromOverlay, StopRegionRecordingFromOverlay, PauseRecordingFromOverlay, CancelRegionRecordingWithoutSaving, CancelSelectedRegion, () => _isRecording, () => _isPaused, () => _isStarting || _isStopping, () => _selectedRegionForRecording.HasValue);
                      _regionMoveHandleWindow.Show();
                  }
                  else
                  {
                      _regionMoveHandleWindow.UpdateArea(area);
                  }

                  if (_regionResizeHandles == null)
                  {
                      _regionResizeHandles = new RegionResizeHandlesController(area, UpdateSelectedRegion);
                  }
                  else
                  {
                      _regionResizeHandles.UpdateArea(area, null);
                  }
              }

              private void UpdateSelectedRegion(DrawingRectangle area)
              {
                  UpdateSelectedRegion(area, null);
              }

              private void UpdateSelectedRegion(DrawingRectangle area, RegionResizeEdge? activeResizeEdge)
              {
                  if (_isRecording && _selectedRegionForRecording.HasValue &&
                      (area.Width != _selectedRegionForRecording.Value.Width || area.Height != _selectedRegionForRecording.Value.Height))
                  {
                      SetStatus("录制中不能调整选区大小，请结束后再调整", StatusTone.Busy);
                      return;
                  }
                  _selectedRegionForRecording = area;
                  _regionOutlineWindow?.UpdateArea(area);
                  _regionMoveHandleWindow?.UpdateArea(area);
                  _regionResizeHandles?.UpdateArea(area, activeResizeEdge);

                  if (!_isRecording || _recorder == null || _activeDisplaySource == null) return;
                  try
                  {
                      _activeDisplaySource.SourceRect = new ScreenRect(area.X, area.Y, area.Width, area.Height);
                      var applied = _recorder.GetDynamicOptionsBuilder()
                          .SetUpdatedRecordingSource(_activeDisplaySource)
                          .Apply();
                      if (!applied)
                          SetStatus("区域更新失败，请重试", StatusTone.Busy);
                  }
                  catch
                  {
                      SetStatus("区域更新失败，请重试", StatusTone.Error);
                  }
              }

              private void CloseRegionOutline()
              {
                  if (_regionResizeHandles != null)
                  {
                      _regionResizeHandles.Close();
                      _regionResizeHandles = null;
                  }
                  if (_regionMoveHandleWindow != null)
                  {
                      _regionMoveHandleWindow.Close();
                      _regionMoveHandleWindow = null;
                  }
                  if (_regionOutlineWindow != null)
                  {
                      _regionOutlineWindow.Close();
                      _regionOutlineWindow = null;
                  }
              }

