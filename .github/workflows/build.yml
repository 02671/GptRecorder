              public void RefreshActionState()
              {
                  var recording = _isRecording();
                  var paused = _isPaused();
                  var busy = _isBusy();
                  var selected = _hasSelection();
                  _startButton.Content = "录制";
                  _pauseButton.Content = paused ? "继续" : "暂停";
                  _stopButton.Content = "结束";
                  _discardButton.Content = "取消";
                  _startButton.IsEnabled = selected && !recording && !busy;
                  _pauseButton.IsEnabled = selected && recording && !busy;
                  _stopButton.IsEnabled = selected && recording && !busy;
                  _discardButton.IsEnabled = selected && recording && !busy;
                  _cancelButton.IsEnabled = selected && !recording && !busy;
              }
          
              public void SetRecordingTime(string value)
              {
                  _recordingTimeText.Text = value;
              }

              public void UpdateArea(DrawingRectangle area)
              {
                  _area = area;
                  if (!_dragging && IsInitialized) PositionHandle();
              }
          
              private void PositionHandle()
              {
                  if (!IsInitialized) return;
                  var bounds = System.Windows.Forms.SystemInformation.VirtualScreen;
                  var widthPixels = Width * _scaleX;
                  var heightPixels = Height * _scaleY;
                  var left = _area.X + _area.Width - widthPixels;
                  left = Math.Clamp(left, bounds.Left, Math.Max(bounds.Left, bounds.Right - widthPixels));
          
                  var below = _area.Y + _area.Height + ToolbarGap;
                  var top = below + heightPixels <= bounds.Bottom
                      ? below
                      : _area.Y - heightPixels - ToolbarGap;
                  top = Math.Clamp(top, bounds.Top, Math.Max(bounds.Top, bounds.Bottom - heightPixels));
          
                  Left = left / _scaleX;
                  Top = top / _scaleY;
              }
          
              private void OnMoveHandlePreviewKeyDown(object sender, KeyEventArgs e)
              {
                  if (e.Key != Key.Escape) return;
                  if (_hasSelection() && !_isRecording() && !_isBusy())
                      _cancelCallback();
                  e.Handled = true;
              }
          
              private void OnHandleMouseDown(object sender, MouseButtonEventArgs e)
              {
                  if (e.ChangedButton != MouseButton.Left) return;
                  _dragging = true;
                  _dragStartArea = _area;
                  _dragStartLeft = Left;
                  _dragStartTop = Top;
                  try
                  {
                      DragMove();
                  }
                  finally
                  {
                      _dragging = false;
                      PositionHandle();
                      Activate();
                      Focus();
                      Keyboard.Focus(this);
                  }
                  e.Handled = true;
              }
          
              private void OnHandleLocationChanged(object? sender, EventArgs e)
              {
                  if (!_dragging) return;
                  var dx = (int)Math.Round((Left - _dragStartLeft) * _scaleX);
                  var dy = (int)Math.Round((Top - _dragStartTop) * _scaleY);
                  var x = _dragStartArea.X + dx;
                  var y = _dragStartArea.Y + dy;
          
                  var bounds = System.Windows.Forms.SystemInformation.VirtualScreen;
                  x = Math.Clamp(x, bounds.Left, Math.Max(bounds.Left, bounds.Right - _dragStartArea.Width));
                  y = Math.Clamp(y, bounds.Top, Math.Max(bounds.Top, bounds.Bottom - _dragStartArea.Height));
                  _moveCallback(new DrawingRectangle(x, y, _dragStartArea.Width, _dragStartArea.Height));
              }
          }

          internal enum RegionResizeEdge
          {
              TopLeft, Top, TopRight, Right, BottomRight, Bottom, BottomLeft, Left
          }

          internal sealed class RegionResizeHandlesController
          {
              private readonly System.Collections.Generic.List<RegionResizeHandleWindow> _handles = new();
              private readonly Action<DrawingRectangle, RegionResizeEdge?> _resizeCallback;
              private DrawingRectangle _area;

              public RegionResizeHandlesController(DrawingRectangle area, Action<DrawingRectangle, RegionResizeEdge?> resizeCallback)
              {
                  _area = area;
                  _resizeCallback = resizeCallback;
                  foreach (RegionResizeEdge edge in Enum.GetValues(typeof(RegionResizeEdge)))
                  {
                      var handle = new RegionResizeHandleWindow(area, edge, OnHandleDrag, OnHandleDragComplete);
                      _handles.Add(handle);
                      handle.Show();
                  }
                  UpdateArea(area, null);
              }

              public void UpdateArea(DrawingRectangle area, RegionResizeEdge? activeEdge)
              {
                  _area = area;
                  foreach (var handle in _handles) handle.UpdateArea(area, activeEdge);
              }

              public void SetVisible(bool visible)
              {
                  foreach (var handle in _handles)
                  {
                      if (visible)
                      {
                          if (!handle.IsVisible) handle.Show();
                      }
                      else
                      {
                          if (handle.IsVisible) handle.Hide();
                      }
                  }
              }

              private void OnHandleDrag(DrawingRectangle area, RegionResizeEdge edge)
              {
                  _area = area;
                  _resizeCallback(area, edge);
              }

              private void OnHandleDragComplete()
              {
                  UpdateArea(_area, null);
              }

              public void Close()
              {
                  foreach (var handle in _handles) handle.Close();
                  _handles.Clear();
              }
          }

          internal sealed class RegionResizeHandleWindow : Window
          {
              private const int GwlExStyle = -20;
              private const int WsExToolWindow = 0x00000080;
              private const int MinimumWidth = 80;
              private const int MinimumHeight = 60;
              private readonly RegionResizeEdge _edge;
              private readonly Action<DrawingRectangle, RegionResizeEdge> _dragCallback;
              private readonly Action _dragCompleteCallback;
              private readonly Border _grip;
              private DrawingRectangle _area;
              private DrawingRectangle _dragStartArea;
              private int _startCursorX;
              private int _startCursorY;
              private double _scaleX = 1.0;
              private double _scaleY = 1.0;
              private bool _dragging;

              [System.Runtime.InteropServices.StructLayout(System.Runtime.InteropServices.LayoutKind.Sequential)]
              private struct NativePoint { public int X; public int Y; }

              [System.Runtime.InteropServices.DllImport("user32.dll", SetLastError = true)]
              private static extern bool GetCursorPos(out NativePoint point);

              [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint = "GetWindowLong", SetLastError = true)]
              private static extern int GetWindowLong(IntPtr hWnd, int nIndex);

              [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint = "SetWindowLong", SetLastError = true)]
              private static extern int SetWindowLong(IntPtr hWnd, int nIndex, int dwNewLong);

              public RegionResizeHandleWindow(DrawingRectangle area, RegionResizeEdge edge, Action<DrawingRectangle, RegionResizeEdge> dragCallback, Action dragCompleteCallback)
              {
                  _area = area;
                  _edge = edge;
                  _dragCallback = dragCallback;
                  _dragCompleteCallback = dragCompleteCallback;
                  WindowStyle = WindowStyle.None;
                  ResizeMode = ResizeMode.NoResize;
                  AllowsTransparency = true;
                  Background = Brushes.Transparent;
                  ShowInTaskbar = false;
                  ShowActivated = false;
                  Focusable = false;
                  Topmost = true;
                  WindowStartupLocation = WindowStartupLocation.Manual;
                  Width = 18;
                  Height = 18;
                  _grip = new Border
                  {
                      Width = 14,
                      Height = 14,
                      Background = new SolidColorBrush(Color.FromRgb(255, 255, 255)),
                      BorderBrush = new SolidColorBrush(Color.FromRgb(54, 105, 232)),
                      BorderThickness = new Thickness(2),
                      CornerRadius = new CornerRadius(3),
                      Cursor = CursorForEdge(edge),
                      HorizontalAlignment = System.Windows.HorizontalAlignment.Center,
                      VerticalAlignment = System.Windows.VerticalAlignment.Center
                  };
                  Content = _grip;
                  _grip.MouseLeftButtonDown += OnMouseDown;
                  _grip.MouseMove += OnMouseMove;
                  _grip.MouseLeftButtonUp += OnMouseUp;
                  SourceInitialized += (_, _) =>
                  {
                      var hwnd = new WindowInteropHelper(this).Handle;
                      var style = GetWindowLong(hwnd, GwlExStyle);
                      SetWindowLong(hwnd, GwlExStyle, style | WsExToolWindow);
                      var dpi = VisualTreeHelper.GetDpi(this);
                      _scaleX = dpi.DpiScaleX > 0 ? dpi.DpiScaleX : 1.0;
                      _scaleY = dpi.DpiScaleY > 0 ? dpi.DpiScaleY : 1.0;
                      PositionHandle();
                  };
                  Loaded += (_, _) => PositionHandle();
              }

              private static Cursor CursorForEdge(RegionResizeEdge edge)
              {
                  return edge == RegionResizeEdge.Left || edge == RegionResizeEdge.Right ? Cursors.SizeWE :
                         edge == RegionResizeEdge.Top || edge == RegionResizeEdge.Bottom ? Cursors.SizeNS :
                         edge == RegionResizeEdge.TopLeft || edge == RegionResizeEdge.BottomRight ? Cursors.SizeNWSE : Cursors.SizeNESW;
              }

              public void UpdateArea(DrawingRectangle area, RegionResizeEdge? activeEdge)
              {
                  _area = area;
                  if (IsInitialized) PositionHandle();
              }

              private void PositionHandle()
              {
                  if (!IsInitialized) return;
                  var halfWidthPixels = Width * _scaleX / 2.0;
                  var halfHeightPixels = Height * _scaleY / 2.0;
                  var isLeft = _edge == RegionResizeEdge.TopLeft || _edge == RegionResizeEdge.Left || _edge == RegionResizeEdge.BottomLeft;
                  var isRight = _edge == RegionResizeEdge.TopRight || _edge == RegionResizeEdge.Right || _edge == RegionResizeEdge.BottomRight;
                  var isTop = _edge == RegionResizeEdge.TopLeft || _edge == RegionResizeEdge.Top || _edge == RegionResizeEdge.TopRight;
                  var isBottom = _edge == RegionResizeEdge.BottomLeft || _edge == RegionResizeEdge.Bottom || _edge == RegionResizeEdge.BottomRight;
                  var centerX = isLeft ? _area.Left - halfWidthPixels - 2.0 :
                                isRight ? _area.Right + halfWidthPixels + 2.0 :
                                _area.Left + _area.Width / 2.0;
                  var centerY = isTop ? _area.Top - halfHeightPixels - 2.0 :
                                isBottom ? _area.Bottom + halfHeightPixels + 2.0 :
                                _area.Top + _area.Height / 2.0;
                  Left = (centerX - halfWidthPixels) / _scaleX;
                  Top = (centerY - halfHeightPixels) / _scaleY;
              }

              private void OnMouseDown(object sender, MouseButtonEventArgs e)
              {
                  if (e.ChangedButton != MouseButton.Left || !GetCursorPos(out var cursor)) return;
                  _dragging = true;
                  _dragStartArea = _area;
                  _startCursorX = cursor.X;
                  _startCursorY = cursor.Y;
                  _grip.CaptureMouse();
                  e.Handled = true;
              }

              private void OnMouseMove(object sender, MouseEventArgs e)
              {
                  if (!_dragging || e.LeftButton != MouseButtonState.Pressed || !GetCursorPos(out var cursor)) return;
                  var dx = cursor.X - _startCursorX;
                  var dy = cursor.Y - _startCursorY;
                  var bounds = System.Windows.Forms.SystemInformation.VirtualScreen;
                  var left = _dragStartArea.Left;
                  var top = _dragStartArea.Top;
                  var right = _dragStartArea.Right;
                  var bottom = _dragStartArea.Bottom;

                  if (_edge == RegionResizeEdge.Left || _edge == RegionResizeEdge.TopLeft || _edge == RegionResizeEdge.BottomLeft)
                      left = Math.Clamp(_dragStartArea.Left + dx, bounds.Left, right - MinimumWidth);
                  if (_edge == RegionResizeEdge.Right || _edge == RegionResizeEdge.TopRight || _edge == RegionResizeEdge.BottomRight)
                      right = Math.Clamp(_dragStartArea.Right + dx, left + MinimumWidth, bounds.Right);
                  if (_edge == RegionResizeEdge.Top || _edge == RegionResizeEdge.TopLeft || _edge == RegionResizeEdge.TopRight)
                      top = Math.Clamp(_dragStartArea.Top + dy, bounds.Top, bottom - MinimumHeight);
                  if (_edge == RegionResizeEdge.Bottom || _edge == RegionResizeEdge.BottomLeft || _edge == RegionResizeEdge.BottomRight)
                      bottom = Math.Clamp(_dragStartArea.Bottom + dy, top + MinimumHeight, bounds.Bottom);

                  if (right - left < MinimumWidth || bottom - top < MinimumHeight) return;
                  var resized = DrawingRectangle.FromLTRB(left, top, right, bottom);
                  if (resized != _area) _dragCallback(resized, _edge);
                  e.Handled = true;
              }

              private void OnMouseUp(object sender, MouseButtonEventArgs e)
              {
                  if (!_dragging || e.ChangedButton != MouseButton.Left) return;
                  _dragging = false;
                  _grip.ReleaseMouseCapture();
                  _dragCompleteCallback();
                  e.Handled = true;
              }
          }
          
          '@
