          $oldRuns = @($runResponse.workflow_runs | Where-Object { [long]$_.id -ne $currentRunId })
          $oldRunIds = @($oldRuns | ForEach-Object { [string]$_.id })

          $artifactUrl = "https://api.github.com/repos/$repo/actions/artifacts?per_page=100"
          $artifactResponse = Invoke-RestMethod -Method Get -Uri $artifactUrl -Headers $headers
          foreach ($artifact in $artifactResponse.artifacts) {
            if ($null -ne $artifact.workflow_run -and $oldRunIds -contains [string]$artifact.workflow_run.id) {
              Write-Host "Deleting old build package: $($artifact.name) (artifact $($artifact.id))"
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/actions/artifacts/$($artifact.id)" -Headers $headers
            }
          }

          foreach ($run in $oldRuns) {
            Write-Host "Deleting old build record: $($run.id) - $($run.display_title)"
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/actions/runs/$($run.id)" -Headers $headers
          }
          Write-Host "Kept the latest successful workflow run $currentRunId and its artifact.";
