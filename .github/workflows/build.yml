              private void ApplyArea()
              {
                  Left = (_area.X - MarginPixels) / _scaleX;
                  Top = (_area.Y - MarginPixels) / _scaleY;
                  Width = (_area.Width + MarginPixels * 2) / _scaleX;
                  Height = (_area.Height + MarginPixels * 2) / _scaleY;
                  _canvas.Width = Width;
                  _canvas.Height = Height;
                  _canvas.Children.Clear();
          
                  var brush = new SolidColorBrush(Color.FromRgb(54, 105, 232));
                  AddStrip(0, 0, BorderPixels / _scaleX, Height, brush);
                  AddStrip((MarginPixels + _area.Width) / _scaleX, 0, BorderPixels / _scaleX, Height, brush);
                  AddStrip(MarginPixels / _scaleX, 0, _area.Width / _scaleX, BorderPixels / _scaleY, brush);
                  AddStrip(MarginPixels / _scaleX, (MarginPixels + _area.Height) / _scaleY, _area.Width / _scaleX, BorderPixels / _scaleY, brush);
              }
          
              private void AddStrip(double left, double top, double width, double height, Brush brush)
              {
                  var strip = new ShapesRectangle { Width = width, Height = height, Fill = brush, IsHitTestVisible = false };
                  Canvas.SetLeft(strip, left);
                  Canvas.SetTop(strip, top);
                  _canvas.Children.Add(strip);
              }
          }
          
