name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify and extract project archive
        shell: pwsh
        run: |
          if (!(Test-Path .\project.zip)) { throw 'Please upload the provided project ZIP to the repository root as project.zip.' }
          Expand-Archive -Path .\project.zip -DestinationPath .\_src -Force
          $project = Get-ChildItem -Path .\_src -Filter QingRecorder.csproj -Recurse | Select-Object -First 1
          if (!$project) { throw 'QingRecorder.csproj was not found inside project.zip.' }
          "PROJECT_FILE=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Resolve WPF and Windows Forms type conflicts
        shell: pwsh
        run: |
          $root = Split-Path $env:PROJECT_FILE
          $appPath = Join-Path $root 'App.xaml.cs'
          $app = Get-Content -LiteralPath $appPath -Raw
          $app = $app.Replace('public partial class App : Application', 'public partial class App : System.Windows.Application')
          Set-Content -LiteralPath $appPath -Value $app -Encoding utf8
          $regionPath = Join-Path $root 'RegionSelectionWindow.cs'
          $region = Get-Content -LiteralPath $regionPath -Raw
          $aliases = "using MouseEventArgs = System.Windows.Input.MouseEventArgs;`nusing KeyEventArgs = System.Windows.Input.KeyEventArgs;`nusing Point = System.Windows.Point;`nusing Color = System.Windows.Media.Color;`nusing Brushes = System.Windows.Media.Brushes;`nusing Cursors = System.Windows.Input.Cursors;`nusing Orientation = System.Windows.Controls.Orientation;"
          $region = $region.Replace('using System.Windows.Input;', "using System.Windows.Input;`n$aliases")
          $region = $region.Replace('HorizontalAlignment = HorizontalAlignment.Center', 'HorizontalAlignment = System.Windows.HorizontalAlignment.Center')
          Set-Content -LiteralPath $regionPath -Value $region -Encoding utf8
          $mainPath = Join-Path $root 'MainWindow.xaml.cs'
          $main = Get-Content -LiteralPath $mainPath -Raw
          $main = $main.Replace('using System.Windows;', "using System.Windows;`nusing MessageBox = System.Windows.MessageBox;")
          $audioChecks = '(?s)\s*if \(recordSystemAudio && Recorder\.GetSystemAudioDevices\(AudioDeviceSource\.OutputDevices\).*?\n            \}\s*if \(recordMicrophone && Recorder\.GetSystemAudioDevices\(AudioDeviceSource\.InputDevices\).*?\n            \}'
          $main = [regex]::Replace($main, $audioChecks, '')
          Set-Content -LiteralPath $mainPath -Value $main -Encoding utf8
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_FILE" --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:PublishTrimmed=false --output .\artifacts\publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          Compress-Archive -Path '.\artifacts\publish\*' -DestinationPath '.\artifacts\轻录屏-Windows-x64.zip' -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingRecorder-Windows-x64
          path: artifacts/轻录屏-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 轻录屏 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/轻录屏-Windows-x64.zip
