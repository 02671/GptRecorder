name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify and extract project archive
        shell: pwsh
        run: |
          if (!(Test-Path .\project.zip)) { throw 'Please upload the provided project ZIP to the repository root as project.zip.' }
          Expand-Archive -Path .\project.zip -DestinationPath .\_src -Force
          $project = Get-ChildItem -Path .\_src -Filter QingRecorder.csproj -Recurse | Select-Object -First 1
          if (!$project) { throw 'QingRecorder.csproj was not found inside project.zip.' }
          "PROJECT_FILE=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Enable Windows 10 1607 capture and compact the UI
        shell: pwsh
        run: |
          $root = Split-Path $env:PROJECT_FILE
          $xamlPath = Join-Path $root 'MainWindow.xaml'
          $xaml = Get-Content -LiteralPath $xamlPath -Raw
          $oldWindowSize = 'Height="790" Width="720" MinHeight="790" MinWidth="720"'
          if (!$xaml.Contains($oldWindowSize)) { throw 'Could not find the original main-window dimensions.' }
          $xaml = $xaml.Replace($oldWindowSize, 'Height="650" Width="640" MinHeight="650" MinWidth="640"')
          $rowToken = '<Grid.RowDefinitions>'
          $rowIndex = $xaml.IndexOf($rowToken, [StringComparison]::Ordinal)
          if ($rowIndex -lt 0) { throw 'Could not find the main layout grid.' }
          if (!$xaml.Contains('<Grid.LayoutTransform>')) {
            $transform = '<Grid.LayoutTransform><ScaleTransform ScaleX="0.75" ScaleY="0.75" /></Grid.LayoutTransform>' + [Environment]::NewLine + '    '
            $xaml = $xaml.Insert($rowIndex, $transform)
          }
          $regionRadioToken = '<RadioButton x:Name="RegionRadio" GroupName="CaptureMode"'
          if ($xaml.Contains($regionRadioToken)) {
            $xaml = $xaml.Replace($regionRadioToken, '<RadioButton x:Name="RegionRadio" Click="RegionRadio_Click" GroupName="CaptureMode"')
          } elseif (!$xaml.Contains('Click="RegionRadio_Click"')) {
            throw 'Could not find RegionRadio in MainWindow.xaml.'
          }
          Set-Content -LiteralPath $xamlPath -Value $xaml -Encoding utf8
          $mainPath = Join-Path $root 'MainWindow.xaml.cs'
          $main = Get-Content -LiteralPath $mainPath -Raw
          if (!$main.Contains('private DrawingRectangle? _selectedRegionForRecording;')) {
            $classForState = [regex]::Match($main, '(?s)\bclass\s+MainWindow\b[^\{]*\{')
            if (!$classForState.Success) { throw 'Could not find MainWindow class for region state.' }
            $stateFields = "`r`n    private DrawingRectangle? _selectedRegionForRecording;`r`n    private bool _isOpeningRegionSelector;"
            $main = $main.Insert($classForState.Index + $classForState.Length, $stateFields)
          }
          $oldRegionFlow = '(?s)DrawingRectangle\? selectedRegion = null;\s*if \(RegionRadio\.IsChecked == true\)\s*\{\s*ShowInTaskbar = true;.*?selectedRegion = selector\.SelectedArea;\s*\}'
          $newRegionFlow = @'
          DrawingRectangle? selectedRegion = null;
          if (RegionRadio.IsChecked == true)
          {
              selectedRegion = _selectedRegionForRecording;
              if (selectedRegion is null)
              {
                  SetStatus("请先点击“区域录制”并完成区域框选", StatusTone.Ready);
                  return;
              }
          }
          else
          {
              _selectedRegionForRecording = null;
          }
          '@
          $patchedRegionFlow = [regex]::Replace($main, $oldRegionFlow, $newRegionFlow, [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($patchedRegionFlow -eq $main -and !$main.Contains('selectedRegion = _selectedRegionForRecording;')) {
            throw 'Could not replace the original region-selection block in StartRecordingAsync.'
          }
          $main = $patchedRegionFlow
          if (!$main.Contains('private void RegionRadio_Click(object sender, RoutedEventArgs e)')) {
            $regionHandler = @'
              private void RegionRadio_Click(object sender, RoutedEventArgs e)
              {
                  if (!IsLoaded || _isStarting || _isRecording || _isStopping || _isOpeningRegionSelector) return;
                  _isOpeningRegionSelector = true;
                  try
                  {
                      ShowInTaskbar = true;
                      WindowState = WindowState.Normal;
                      Activate();
                      var selector = new RegionSelectionWindow { Owner = this };
                      var accepted = selector.ShowDialog();
                      if (accepted != true || selector.SelectedArea is null)
                      {
                          _selectedRegionForRecording = null;
                          SetStatus("已取消区域选择，请重新点击“区域录制”框选", StatusTone.Ready);
                          return;
                      }
                      _selectedRegionForRecording = selector.SelectedArea;
                      SetStatus("已选择区域，点击开始录制", StatusTone.Ready);
                  }
                  finally
                  {
                      _isOpeningRegionSelector = false;
                  }
              }

          '@
            $startMethod = [regex]::Match($main, '(?m)^\s*private async Task StartRecordingAsync\s*\(')
            if (!$startMethod.Success) { throw 'Could not find StartRecordingAsync to insert the region-click handler.' }
            $main = $main.Insert($startMethod.Index, $regionHandler)
          }
          $oldApi = 'displaySource.RecorderApi = RecorderApi.WindowsGraphicsCapture;'
          if ($main.Contains($oldApi)) {
            $main = $main.Replace($oldApi, 'displaySource.RecorderApi = RecorderApi.DesktopDuplication;')
          } elseif (!$main.Contains('displaySource.RecorderApi = RecorderApi.DesktopDuplication;')) {
            throw 'Could not locate the display capture API assignment.'
          }
          $cropPattern = 'outputOptions\.SourceRect\s*=\s*new ScreenRect\(rect\.X,\s*rect\.Y,\s*rect\.Width,\s*rect\.Height\);'
          $fixedMain = [regex]::Replace($main, $cropPattern, 'displaySource.SourceRect = new ScreenRect(rect.X, rect.Y, rect.Width, rect.Height);', [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if ($fixedMain -eq $main -and !$main.Contains('displaySource.SourceRect = new ScreenRect(rect.X, rect.Y, rect.Width, rect.Height);')) {
            throw 'Could not find the region crop assignment to fix.'
          }
          $main = $fixedMain
          $classMatch = [regex]::Match($main, '(?s)\bclass\s+MainWindow\b[^\{]*\{')
          if (!$classMatch.Success) { throw 'Could not find MainWindow class to add the region outline.' }
          if (!$main.Contains('private RegionOutlineWindow? _regionOutlineWindow;')) {
            $main = $main.Insert($classMatch.Index + $classMatch.Length, "`r`n    private RegionOutlineWindow? _regionOutlineWindow;")
          }
          $recordMatch = [regex]::Match($main, '(?<object>[A-Za-z_]\w*)\.Record\s*\(')
          if (!$recordMatch.Success) { throw 'Could not find the recorder Record(...) call for outline lifetime hooks.' }
          $recordObject = $recordMatch.Groups['object'].Value
          $lineStart = $main.LastIndexOf("`n", $recordMatch.Index)
          if ($lineStart -lt 0) { $lineStart = 0 } else { $lineStart++ }
          $indent = [regex]::Match($main.Substring($lineStart, $recordMatch.Index - $lineStart), '^\s*').Value
          $hooks = @"
          ${indent}if (selectedRegion.HasValue)
          ${indent}{
          ${indent}    _regionOutlineWindow = new RegionOutlineWindow(selectedRegion.Value);
          ${indent}    _regionOutlineWindow.Show();
          ${indent}}
          ${indent}$recordObject.OnRecordingComplete += (_, __) => System.Windows.Application.Current.Dispatcher.BeginInvoke(new System.Action(CloseRegionOutline));
          ${indent}$recordObject.OnRecordingFailed += (_, __) => System.Windows.Application.Current.Dispatcher.BeginInvoke(new System.Action(CloseRegionOutline));
          "@
          $main = $main.Insert($lineStart, $hooks + "`r`n")
          $closeMethod = @'
              private void CloseRegionOutline()
              {
                  if (_regionOutlineWindow == null) return;
                  _regionOutlineWindow.Close();
                  _regionOutlineWindow = null;
              }
          
          '@
          $lastBrace = $main.LastIndexOf('}')
          if ($lastBrace -lt 0) { throw 'Could not find end of MainWindow to add outline cleanup.' }
          $main = $main.Insert($lastBrace, $closeMethod)
          Set-Content -LiteralPath $mainPath -Value $main -Encoding utf8
          $overlayPath = Join-Path $root 'RegionOutlineWindow.cs'
          $overlayCode = @'
          using System;
          using DrawingRectangle = System.Drawing.Rectangle;
          using Brush = System.Windows.Media.Brush;
          using Brushes = System.Windows.Media.Brushes;
          using Color = System.Windows.Media.Color;
          using SolidColorBrush = System.Windows.Media.SolidColorBrush;
          using System.Runtime.InteropServices;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Interop;
          using System.Windows.Media;
          using ShapesRectangle = System.Windows.Shapes.Rectangle;
          
          namespace QingRecorder;
          
          internal sealed class RegionOutlineWindow : Window
          {
              private const int GwlExStyle = -20;
              private const int WsExTransparent = 0x00000020;
              private const int WsExToolWindow = 0x00000080;
              private const int WsExNoActivate = 0x08000000;
              private const double MarginPixels = 4.0;
              private const double BorderPixels = 3.0;
              private readonly DrawingRectangle _area;
              private readonly Canvas _canvas = new Canvas { Background = Brushes.Transparent };
          
              [DllImport("user32.dll", EntryPoint = "GetWindowLong", SetLastError = true)]
              private static extern int GetWindowLong(IntPtr hWnd, int nIndex);
          
              [DllImport("user32.dll", EntryPoint = "SetWindowLong", SetLastError = true)]
              private static extern int SetWindowLong(IntPtr hWnd, int nIndex, int dwNewLong);
          
              public RegionOutlineWindow(DrawingRectangle area)
              {
                  _area = area;
                  WindowStyle = WindowStyle.None;
                  ResizeMode = ResizeMode.NoResize;
                  AllowsTransparency = true;
                  Background = Brushes.Transparent;
                  Content = _canvas;
                  ShowInTaskbar = false;
                  ShowActivated = false;
                  Focusable = false;
                  IsHitTestVisible = false;
                  Topmost = true;
                  WindowStartupLocation = WindowStartupLocation.Manual;
                  Width = 1;
                  Height = 1;
          
                  SourceInitialized += (_, _) =>
                  {
                      var hwnd = new WindowInteropHelper(this).Handle;
                      var exStyle = GetWindowLong(hwnd, GwlExStyle);
                      SetWindowLong(hwnd, GwlExStyle, exStyle | WsExTransparent | WsExToolWindow | WsExNoActivate);
          
                      var dpi = VisualTreeHelper.GetDpi(this);
                      var sx = dpi.DpiScaleX > 0 ? dpi.DpiScaleX : 1.0;
                      var sy = dpi.DpiScaleY > 0 ? dpi.DpiScaleY : 1.0;
          
                      Left = (_area.X - MarginPixels) / sx;
                      Top = (_area.Y - MarginPixels) / sy;
                      Width = (_area.Width + MarginPixels * 2) / sx;
                      Height = (_area.Height + MarginPixels * 2) / sy;
                      _canvas.Width = Width;
                      _canvas.Height = Height;
                      _canvas.Children.Clear();
          
                      var brush = new SolidColorBrush(Color.FromRgb(72, 112, 255));
                      AddStrip(0, 0, BorderPixels / sx, Height, brush);
                      AddStrip((MarginPixels + _area.Width) / sx, 0, BorderPixels / sx, Height, brush);
                      AddStrip(MarginPixels / sx, 0, _area.Width / sx, BorderPixels / sy, brush);
                      AddStrip(MarginPixels / sx, (MarginPixels + _area.Height) / sy, _area.Width / sx, BorderPixels / sy, brush);
                  };
              }
          
              private void AddStrip(double left, double top, double width, double height, Brush brush)
              {
                  var strip = new ShapesRectangle { Width = width, Height = height, Fill = brush, IsHitTestVisible = false };
                  Canvas.SetLeft(strip, left);
                  Canvas.SetTop(strip, top);
                  _canvas.Children.Add(strip);
              }
          }
          '@
          Set-Content -LiteralPath $overlayPath -Value $overlayCode -Encoding utf8
          Write-Host 'Capture API set to DesktopDuplication; UI reduced to 640x650 at 75%; region crop assigned to DisplayRecordingSource.SourceRect; recording outline is shown outside the crop and closed on completion/failure.'
          Write-Host '===== RegionSelectionWindow.cs ====='
          $regionPath = Join-Path $root 'RegionSelectionWindow.cs'
          Get-Content -LiteralPath $regionPath | ForEach-Object { Write-Host $_ }
          Write-Host '===== MainWindow region/capture lines ====='
          Select-String -LiteralPath $mainPath -Pattern 'Region|region|SourceRect|Selected|RecorderApi|displaySource|outputOptions|StartRecording|StopRecording' | ForEach-Object { Write-Host ("{0}: {1}" -f $_.LineNumber, $_.Line.Trim()) }
      - name: Resolve WPF and Windows Forms type conflicts
        shell: pwsh
        run: |
          $root = Split-Path $env:PROJECT_FILE
          $appPath = Join-Path $root 'App.xaml.cs'
          $app = Get-Content -LiteralPath $appPath -Raw
          $app = $app.Replace('public partial class App : Application', 'public partial class App : System.Windows.Application')
          Set-Content -LiteralPath $appPath -Value $app -Encoding utf8
          $regionPath = Join-Path $root 'RegionSelectionWindow.cs'
          $region = Get-Content -LiteralPath $regionPath -Raw
          $aliases = "using MouseEventArgs = System.Windows.Input.MouseEventArgs;`nusing KeyEventArgs = System.Windows.Input.KeyEventArgs;`nusing Point = System.Windows.Point;`nusing Color = System.Windows.Media.Color;`nusing Brushes = System.Windows.Media.Brushes;`nusing Cursors = System.Windows.Input.Cursors;`nusing Orientation = System.Windows.Controls.Orientation;"
          $region = $region.Replace('using System.Windows.Input;', "using System.Windows.Input;`n$aliases")
          $region = $region.Replace('HorizontalAlignment = HorizontalAlignment.Center', 'HorizontalAlignment = System.Windows.HorizontalAlignment.Center')
          Set-Content -LiteralPath $regionPath -Value $region -Encoding utf8
          $mainPath = Join-Path $root 'MainWindow.xaml.cs'
          $main = Get-Content -LiteralPath $mainPath -Raw
          $main = $main.Replace('using System.Windows;', "using System.Windows;`nusing MessageBox = System.Windows.MessageBox;")
          $audioChecks = '(?s)\s*if \(recordSystemAudio && Recorder\.GetSystemAudioDevices\(AudioDeviceSource\.OutputDevices\).*?\n            \}\s*if \(recordMicrophone && Recorder\.GetSystemAudioDevices\(AudioDeviceSource\.InputDevices\).*?\n            \}'
          $main = [regex]::Replace($main, $audioChecks, '')
          Set-Content -LiteralPath $mainPath -Value $main -Encoding utf8
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_FILE" --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:PublishTrimmed=false --output .\artifacts\publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          Compress-Archive -Path '.\artifacts\publish\*' -DestinationPath '.\artifacts\轻录屏-Windows-x64.zip' -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingRecorder-Windows-x64
          path: artifacts/轻录屏-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 轻录屏 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/轻录屏-Windows-x64.zip
